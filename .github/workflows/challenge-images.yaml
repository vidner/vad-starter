name: Challenge images

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: challenge-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.services.outputs.directories }}
      image_registry: ${{ steps.registry.outputs.image_registry }}
    steps:
      - uses: actions/checkout@v5
      - id: registry
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repository=$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          echo "image_registry=ghcr.io/$owner/$repository" >> "$GITHUB_OUTPUT"
      - id: services
        shell: bash
        run: |
          directories=$(find services -mindepth 2 -maxdepth 2 -name compose.yaml -printf '%h\n' \
            | sort \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          if [ "$directories" = "[]" ]; then
            echo "No service Compose files found" >&2
            exit 1
          fi
          echo "directories=$directories" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    env:
      VAD_IMAGE_REGISTRY: ${{ needs.discover.outputs.image_registry }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.directory }}
        shell: bash
        run: |
          package=$(basename "${{ matrix.directory }}")
          override=$(mktemp)
          docker compose \
            --project-directory "${{ matrix.directory }}" \
            --file "${{ matrix.directory }}/compose.yaml" \
            config --format json \
            | jq \
              --arg registry "$VAD_IMAGE_REGISTRY" \
              --arg package "$package" \
              '{
                services: (
                  .services
                  | to_entries
                  | map(select(.value.build != null) | {
                      key: .key,
                      value: {
                        image: (
                          $registry + ":" + $package + "-" + (
                            (
                              if (.value.build | type) == "string" then .value.build
                              elif (.value.build.context // "") != "" then .value.build.context
                              else .key
                              end
                            )
                            | sub("/+$"; "")
                            | split("/")
                            | last
                          )
                        )
                      }
                    })
                  | from_entries
                )
              }' > "$override"
          docker compose \
            --project-directory "${{ matrix.directory }}" \
            --file "${{ matrix.directory }}/compose.yaml" \
            --file "$override" \
            build --pull --push
