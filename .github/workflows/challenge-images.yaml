name: Challenge images

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: challenge-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.services.outputs.directories }}
      staging_registry: ${{ steps.registry.outputs.staging_registry }}
      release_registry: ${{ steps.registry.outputs.release_registry }}
    steps:
      - uses: actions/checkout@v5
      - id: registry
        shell: bash
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repository=$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          echo "staging_registry=ghcr.io/$owner/$repository-staging" >> "$GITHUB_OUTPUT"
          echo "release_registry=ghcr.io/$owner/$repository-release" >> "$GITHUB_OUTPUT"
      - id: services
        shell: bash
        run: |
          directories=$(find services -mindepth 2 -maxdepth 2 -name compose.yaml -printf '%h\n' \
            | sort \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          if [ "$directories" = "[]" ]; then
            echo "No service Compose files found" >&2
            exit 1
          fi
          echo "directories=$directories" >> "$GITHUB_OUTPUT"

  staging:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    env:
      VAD_IMAGE_REGISTRY: ${{ needs.discover.outputs.staging_registry }}
      VAD_IMAGE_SUFFIX: -${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.directory }}
        shell: bash
        run: |
          printf 'services:\n  vpn:\n    image: alpine:3.22.1\n' > "$RUNNER_TEMP/vpn.yaml"
          docker compose \
            --project-directory "${{ matrix.directory }}" \
            --file "${{ matrix.directory }}/compose.yaml" \
            --file "$RUNNER_TEMP/vpn.yaml" \
            build --pull --push

  release:
    needs:
      - discover
      - staging
    runs-on: ubuntu-latest
    environment: image-release
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    env:
      VAD_IMAGE_REGISTRY: ${{ needs.discover.outputs.staging_registry }}
      VAD_IMAGE_SUFFIX: -${{ github.sha }}
      RELEASE_REGISTRY: ${{ needs.discover.outputs.release_registry }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote ${{ matrix.directory }}
        shell: bash
        run: |
          printf 'services:\n  vpn:\n    image: alpine:3.22.1\n' > "$RUNNER_TEMP/vpn.yaml"
          images=$(docker compose \
            --project-directory "${{ matrix.directory }}" \
            --file "${{ matrix.directory }}/compose.yaml" \
            --file "$RUNNER_TEMP/vpn.yaml" \
            config --images | sort -u)
          prefix="$VAD_IMAGE_REGISTRY:"
          suffix="-$GITHUB_SHA"
          promoted=0
          for source in $images; do
            case "$source" in
              "$prefix"*) ;;
              *) continue ;;
            esac
            source_tag=${source#"$prefix"}
            service=${source_tag%"$suffix"}
            if [ "$service" = "$source_tag" ]; then
              echo "Unexpected staging image tag: $source" >&2
              exit 1
            fi
            docker buildx imagetools create \
              --tag "$RELEASE_REGISTRY:$service" \
              --tag "$RELEASE_REGISTRY:$service-$RELEASE_TAG" \
              "$source"
            promoted=$((promoted + 1))
          done
          if [ "$promoted" -eq 0 ]; then
            echo "No buildable challenge images found" >&2
            exit 1
          fi
